      <div style="max-width: 760px; margin: 0 auto; padding: 32px 20px; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.7; color: #1a1c18;">
        <h1 style="font-size: 28px; margin-bottom: 8px;">FPGAgent · 用自然语言编写并仿真数字电路</h1>
        <p style="font-size: 16px; color: #4a4f46;">
          不用买开发板，不用安装 Vivado。输入一句自然语言，AI 智能体自动规划蓝图、编写可综合 Verilog，
          在浏览器里完成确定性自测与修复，并用慢动作门级信号流动画展示电流如何逐级穿过逻辑门、点亮虚拟 FPGA 开发板。
        </p>
        <h2 style="font-size: 18px; margin-top: 24px;">五步开始</h2>
        <ol style="padding-left: 20px;">
          <li>打开工作台，点击「做一个智能交通灯」或「彩色 OLED 贪吃蛇」预设。</li>
          <li>查看 AI 生成的蓝图、Verilog 与自测断言。</li>
          <li>在门级画布观察信号逐级传播。</li>
          <li>切换「屏幕」查看 OLED 输出，或在虚拟板卡上按按键、拨拨码。</li>
          <li>继续用自然语言提修改需求，AI 会重新生成并验证。</li>
        </ol>
        <h2 style="font-size: 18px; margin-top: 24px;">可验证的技术事实</h2>
        <ul style="padding-left: 20px;">
          <li>284 条 Vitest 测试通过，3 条真实模型评测默认跳过。</li>
          <li>纯 TypeScript 实现 Verilog 解析、Lint、门级网表与周期仿真，不依赖后端仿真器。</li>
          <li>部署于 Qoder Sites，源码公开在 GitHub。</li>
        </ul>
